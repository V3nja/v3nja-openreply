name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [v2-foundation]

jobs:
  idempotency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run idempotency regression tests
        run: npx vitest run __tests__/queue-idempotency.test.ts __tests__/dm-worker-idempotency-wiring.test.ts

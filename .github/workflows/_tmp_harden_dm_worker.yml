name: Temporary DM worker hardening

on:
  push:
    branches: [v2-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-foundation
          fetch-depth: 0
      - name: Patch worker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/queue/dm-worker.ts')
          s = p.read_text()
          s = s.replace('import { markDmLogFailed, markDmLogSent, withDeliveryLock } from "./idempotency";', 'import { acquireDeliveryLease, markDmLogFailed, markDmLogSent, withDeliveryLock } from "./idempotency";')

          start = s.index('    const usage = await reserveWorkspaceDMSend(automation.workspaceId);', s.index('async function processComment'))
          end = s.index('    const useOpeningDm =', start)
          replacement = '''    const deliveryKey = `${automation.workspaceId}:automation:${automation.id}:comment:${commentId}:dm`;
    const deliveryLease = await acquireDeliveryLease(deliveryKey);
    if (!deliveryLease) continue;

    const usage = await reserveWorkspaceDMSend(automation.workspaceId);
    if (!usage.allowed) {
      await deliveryLease.release().catch(() => {});
      await prisma.dmLog.update({ where: { automationId_commentId: { automationId: automation.id, commentId } }, data: { status: "SKIPPED_PLAN_LIMIT", matchedKeyword: matchResult.matchedKeyword, errorMessage: `Monthly DM limit reached (${usage.limit})` } });
      continue;
    }

    let rateLimit;
    try {
      rateLimit = await reserveDMSlot(instagramAccountId, requeueAttempt);
    } catch (error) {
      await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
      await deliveryLease.release().catch(() => {});
      await markDmLogFailed({ automationId: automation.id, commentId }, formatError(error), job.attemptsMade + 1);
      throw error;
    }
    if (!rateLimit.allowed) {
      await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
      await deliveryLease.release().catch(() => {});
      if (rateLimit.shouldSkip) {
        await prisma.dmLog.update({ where: { automationId_commentId: { automationId: automation.id, commentId } }, data: { status: "SKIPPED_RATE_LIMIT", errorMessage: "Hourly Instagram DM rate limit reached" } });
        continue;
      }
      if (rateLimit.shouldRequeue) {
        await prisma.dmLog.update({ where: { automationId_commentId: { automationId: automation.id, commentId } }, data: { status: "PENDING", errorMessage: "Hourly rate limit hit; retry scheduled" } });
        await getDMQueue().add("process-comment", { ...job.data, requeueAttempt: requeueAttempt + 1 }, { delay: rateLimit.requeueDelayMs, jobId: `comment_${instagramAccountId}_${commentId}_retry_${requeueAttempt + 1}` });
        continue;
      }
      continue;
    }

'''
          s = s[:start] + replacement + s[end:]

          old = '''    try {
      const deliveryLock = await withDeliveryLock(
        `${automation.workspaceId}:automation:${automation.id}:comment:${commentId}:dm`,
        async () => {
          if (useOpeningDm) {
            const openingText = renderMessageWithTracking({ message: automation.openingDmMessage as string, commenterName, trackedLinks: [] });
            await sendPrivateReplyWithButton(accessToken, automation.instagramAccount.instagramId, commentId, openingText, automation.openingDmButtonLabel as string, automation.requireFollow ? `followcheck:${automation.id}` : `reveal:${automation.id}`);
          } else if (sendFollowPrompt) {
            const promptText = renderMessageWithoutLink({ message: automation.followPromptMessage || "Follow me and tap the button to grab your link!", commenterName });
            await sendPrivateReplyWithButton(accessToken, automation.instagramAccount.instagramId, commentId, promptText, automation.followPromptButtonLabel || "I'm following", `followcheck:${automation.id}`);
          } else if (automation.trackedLinks.length > 0) {
            const bodyText = renderMessageWithoutLink({ message: automation.dmMessage, commenterName }) || "Here's your link:";
            const buttons = buildLinkButtons(automation.trackedLinks, automation.linkButtonLabel);
            try {
              await sendPrivateReplyWithLinkButton(accessToken, automation.instagramAccount.instagramId, commentId, bodyText, buttons);
            } catch (buttonError) {
              if (!isTemplateRejection(buttonError)) throw buttonError;
              await sendPrivateReply(accessToken, automation.instagramAccount.instagramId, commentId, buildInlineLinkFallback(automation.dmMessage, commenterName, automation.trackedLinks, bodyText));
            }
          } else {
            await sendPrivateReply(accessToken, automation.instagramAccount.instagramId, commentId, renderMessageWithTracking({ message: automation.dmMessage, commenterName, trackedLinks: automation.trackedLinks }));
          }
        }
      );
      if (!deliveryLock.acquired) {
        await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
        continue;
      }
      await markDmLogSent({ automationId: automation.id, commentId });
    } catch (error) {
      await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
      await markDmLogFailed(
        { automationId: automation.id, commentId },
        formatError(error),
        job.attemptsMade + 1
      );
      throw error;
    }
'''
          new = '''    try {
      if (useOpeningDm) {
        const openingText = renderMessageWithTracking({ message: automation.openingDmMessage as string, commenterName, trackedLinks: [] });
        await sendPrivateReplyWithButton(accessToken, automation.instagramAccount.instagramId, commentId, openingText, automation.openingDmButtonLabel as string, automation.requireFollow ? `followcheck:${automation.id}` : `reveal:${automation.id}`);
      } else if (sendFollowPrompt) {
        const promptText = renderMessageWithoutLink({ message: automation.followPromptMessage || "Follow me and tap the button to grab your link!", commenterName });
        await sendPrivateReplyWithButton(accessToken, automation.instagramAccount.instagramId, commentId, promptText, automation.followPromptButtonLabel || "I'm following", `followcheck:${automation.id}`);
      } else if (automation.trackedLinks.length > 0) {
        const bodyText = renderMessageWithoutLink({ message: automation.dmMessage, commenterName }) || "Here's your link:";
        const buttons = buildLinkButtons(automation.trackedLinks, automation.linkButtonLabel);
        try {
          await sendPrivateReplyWithLinkButton(accessToken, automation.instagramAccount.instagramId, commentId, bodyText, buttons);
        } catch (buttonError) {
          if (!isTemplateRejection(buttonError)) throw buttonError;
          await sendPrivateReply(accessToken, automation.instagramAccount.instagramId, commentId, buildInlineLinkFallback(automation.dmMessage, commenterName, automation.trackedLinks, bodyText));
        }
      } else {
        await sendPrivateReply(accessToken, automation.instagramAccount.instagramId, commentId, renderMessageWithTracking({ message: automation.dmMessage, commenterName, trackedLinks: automation.trackedLinks }));
      }
      await markDmLogSent({ automationId: automation.id, commentId });
    } catch (error) {
      await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
      await deliveryLease.release().catch(() => {});
      await markDmLogFailed({ automationId: automation.id, commentId }, formatError(error), job.attemptsMade + 1);
      throw error;
    }
'''
          if old not in s:
              raise SystemExit('comment delivery block not found')
          s = s.replace(old, new, 1)

          # Postback reveal: claim before quota/rate reservation.
          marker = '  const usage = await reserveWorkspaceDMSend(automation.workspaceId);\n  if (!usage.allowed) return;\n  try {\n    const revealLock = await withDeliveryLock('
          pos = s.index(marker, s.index('async function processPostback'))
          oldblock_start = pos
          oldblock_end = s.index('\n}\n\nasync function processFollowUp', pos)
          oldblock = s[oldblock_start:oldblock_end]
          newblock = '''  const revealDedupeId = `reveal:${userId}`;
  const revealDeliveryKey = `${automation.workspaceId}:automation:${automation.id}:postback:${revealDedupeId}`;
  const deliveryLease = await acquireDeliveryLease(revealDeliveryKey);
  if (!deliveryLease) return;

  const usage = await reserveWorkspaceDMSend(automation.workspaceId);
  if (!usage.allowed) {
    await deliveryLease.release().catch(() => {});
    return;
  }

  let rateLimit;
  try {
    rateLimit = await reserveDMSlot(instagramAccountId, job.attemptsMade);
  } catch (error) {
    await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
    await deliveryLease.release().catch(() => {});
    await markDmLogFailed({ automationId: automation.id, commentId: revealDedupeId }, formatError(error), job.attemptsMade + 1);
    throw error;
  }
  if (!rateLimit.allowed) {
    await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
    await deliveryLease.release().catch(() => {});
    if (rateLimit.shouldSkip) return;
    throw new Error('Hourly Instagram DM rate limit reached; retry scheduled');
  }

  try {
    await prisma.dmLog.upsert({
      where: { automationId_commentId: { automationId: automation.id, commentId: revealDedupeId } },
      create: {
        workspaceId: automation.workspaceId,
        automationId: automation.id,
        instagramAccountId: automation.instagramAccountId,
        commenterId: userId,
        commenterName,
        commentText: "(button tap)",
        commentId: revealDedupeId,
        status: "PENDING",
        attempts: job.attemptsMade + 1,
        errorMessage: null,
      },
      update: {
        status: "PENDING",
        attempts: job.attemptsMade + 1,
        commenterName,
        errorMessage: null,
      },
    });
    await sendRevealDirectMessage(accessToken, automation, userId, commenterName, "postback");
    await markDmLogSent({ automationId: automation.id, commentId: revealDedupeId });
  } catch (error) {
    await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
    await deliveryLease.release().catch(() => {});
    await markDmLogFailed({ automationId: automation.id, commentId: revealDedupeId }, formatError(error), job.attemptsMade + 1);
    throw error;
  }'''
          s = s[:oldblock_start] + newblock + s[oldblock_end:]

          # Follow-up: add quota/rate after claiming the lease.
          start = s.index('  try {\n    const deliveryLock = await withDeliveryLock(', s.index('async function processFollowUp'))
          end = s.index('\n}\n\nasync function processMessage', start)
          oldfu = s[start:end]
          newfu = '''  const deliveryKey = `${automation.workspaceId}:automation:${automation.id}:followup:${userId}`;
  const deliveryLease = await acquireDeliveryLease(deliveryKey);
  if (!deliveryLease) return;

  const usage = await reserveWorkspaceDMSend(automation.workspaceId);
  if (!usage.allowed) {
    await deliveryLease.release().catch(() => {});
    return;
  }
  let rateLimit;
  try {
    rateLimit = await reserveDMSlot(instagramAccountId, job.attemptsMade);
  } catch (error) {
    await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
    await deliveryLease.release().catch(() => {});
    throw error;
  }
  if (!rateLimit.allowed) {
    await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
    await deliveryLease.release().catch(() => {});
    if (rateLimit.shouldSkip) return;
    if (rateLimit.shouldRequeue) {
      await getDMQueue().add(FOLLOWUP_JOB_NAME, { ...job.data }, { delay: rateLimit.requeueDelayMs, jobId: `followup_${automation.id}_${userId}_retry_${job.attemptsMade + 1}` });
      return;
    }
    throw new Error('Instagram messaging rate limit reached');
  }
  try {
    await prisma.dmLog.upsert({
      where: { automationId_commentId: { automationId: automation.id, commentId: dedupeId } },
      create: {
        workspaceId: automation.workspaceId,
        automationId: automation.id,
        instagramAccountId: automation.instagramAccountId,
        commenterId: userId,
        commenterName: commenterName ?? null,
        commentText: "(scheduled follow-up)",
        commentId: dedupeId,
        status: "PENDING",
        attempts: job.attemptsMade + 1,
        errorMessage: null,
      },
      update: {
        status: "PENDING",
        attempts: job.attemptsMade + 1,
        commenterName: commenterName ?? null,
        errorMessage: null,
      },
    });
    await sendDirectMessage(accessToken, automation.instagramAccount.instagramId, userId, renderMessageWithoutLink({ message: automation.followUpMessage, commenterName: commenterName ?? null }));
    await markDmLogSent({ automationId: automation.id, commentId: dedupeId });
  } catch (error) {
    await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
    await deliveryLease.release().catch(() => {});
    await markDmLogFailed({ automationId: automation.id, commentId: dedupeId }, formatError(error), job.attemptsMade + 1);
    throw error;
  }'''
          s = s[:start] + newfu + s[end:]

          # Message trigger: claim before usage/rate and add account rate reservation.
          start = s.index('    const usage = await reserveWorkspaceDMSend(automation.workspaceId);', s.index('async function processMessage'))
          end = s.index('\n}\n\nasync function processJob', start)
          oldmsg = s[start:end]
          # Retain the log creation body and rewrite only the outer delivery segment using exact split points.
          oldmsg2 = oldmsg
          lease = '''    const deliveryKey = `${automation.workspaceId}:automation:${automation.id}:message:${messageId}`;
    const deliveryLease = await acquireDeliveryLease(deliveryKey);
    if (!deliveryLease) continue;
    const usage = await reserveWorkspaceDMSend(automation.workspaceId);
    if (!usage.allowed) {
      await deliveryLease.release().catch(() => {});
      continue;
    }
    let rateLimit;
    try {
      rateLimit = await reserveDMSlot(instagramAccountId, job.attemptsMade);
    } catch (error) {
      await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
      await deliveryLease.release().catch(() => {});
      throw error;
    }
    if (!rateLimit.allowed) {
      await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);
      await deliveryLease.release().catch(() => {});
      if (rateLimit.shouldSkip) continue;
      if (rateLimit.shouldRequeue) {
        await getDMQueue().add(MESSAGE_JOB_NAME, { ...job.data }, { delay: rateLimit.requeueDelayMs, jobId: `message_${instagramAccountId}_${messageId}_retry_${job.attemptsMade + 1}` });
        continue;
      }
      throw new Error('Instagram messaging rate limit reached');
    }
'''
          oldusage = oldmsg2[0:oldmsg2.index('    try {\n      if (!existingLog)')]
          rest = oldmsg2[oldmsg2.index('    try {\n      if (!existingLog)'):]
          rest = rest.replace('      const deliveryLock = await withDeliveryLock(\n        `${automation.workspaceId}:automation:${automation.id}:message:${messageId}`,\n        async () => {', '      {', 1)
          rest = rest.replace('          if (sendFollowPrompt) await sendDirectMessageWithButton', '          if (sendFollowPrompt) await sendDirectMessageWithButton', 1)
          # Remove the wrapper closing lines immediately before the acquired check.
          rest = rest.replace('        }\n      );\n      if (!deliveryLock.acquired) {\n        await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);\n        continue;\n      }\n      await markDmLogSent({ automationId: automation.id, commentId: dedupeId });', '      }\n      await markDmLogSent({ automationId: automation.id, commentId: dedupeId });', 1)
          rest = rest.replace('      await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);\n      await markDmLogFailed(', '      await releaseWorkspaceDMReservation(automation.workspaceId, usage.periodStart);\n      await deliveryLease.release().catch(() => {});\n      await markDmLogFailed(', 1)
          s = s[:start] + lease + rest + s[end:]

          p.write_text(s)
          PY
          git diff --check
          git diff -- lib/queue/dm-worker.ts
          if git diff --quiet -- lib/queue/dm-worker.ts; then
            echo 'No worker changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/queue/dm-worker.ts
          git commit -m 'fix: claim DM delivery lease before reservations'
          git push origin HEAD:v2-foundation
